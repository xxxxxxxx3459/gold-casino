<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>ROYAL GOLD | Премиум Казино</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #ffd700;
  --gold-dark: #b8860b;
  --bg: #0a0a0c;
  --panel: rgba(25, 25, 30, 0.8);
  --space: #050510;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at top, #1a1a24 0%, var(--bg) 100%);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(var(--gold) 1px, transparent 1px);
  background-size: 50px 50px; opacity: 0.05; z-index: -1;
}
header {
  text-align: center; padding: 30px 15px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
}
.logo {
  font-size: 32px; font-weight: 900; color: var(--gold);
  text-transform: uppercase; letter-spacing: 2px;
  text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
}
.subtitle { color: #888; font-size: 12px; letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
main { max-width: 600px; margin: auto; padding: 15px; }
.card {
  background: var(--panel); backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 215, 0, 0.2); border-radius: 20px;
  padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  position: relative; overflow: hidden;
}
.card::before {
  content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: skewX(-20deg); animation: shine 4s infinite;
}
@keyframes shine { 100% { left: 200%; } }
h2 { font-size: 18px; margin-bottom: 15px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; margin-top: 15px; }
input {
  width: 100%; padding: 14px; background: rgba(0,0,0,0.5);
  border: 1px solid #444; color: white; border-radius: 10px; font-size: 16px;
  font-family: 'Montserrat', sans-serif; transition: 0.3s;
}
input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.2); }
button {
  width: 100%; padding: 16px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #ffd700, #b8860b);
  color: #000; font-weight: 900; font-size: 16px; text-transform: uppercase;
  cursor: pointer; transition: 0.2s; margin-top: 15px;
  box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3); font-family: 'Montserrat', sans-serif;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
button.secondary { background: transparent; border: 1px solid var(--gold); color: var(--gold); box-shadow: none; }
button.danger { background: linear-gradient(135deg, #ff4b2b, #ff003c); color: white; box-shadow: 0 5px 15px rgba(255, 0, 60, 0.3); }
button.success { background: linear-gradient(135deg, #00ff88, #00b359); color: #000; box-shadow: 0 5px 15px rgba(0, 255, 136, 0.3); }
.row { display: flex; gap: 10px; }
.row button { margin-top: 0; }
.balance { font-size: 38px; font-weight: 900; color: #fff; text-align: center; margin: 10px 0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
.balance span { color: var(--gold); font-size: 20px; }

/* Слоты */
.slot-window {
  background: #000; border: 2px solid #333; border-radius: 15px;
  padding: 30px 10px; margin: 20px 0; display: flex; justify-content: center; gap: 10px;
  box-shadow: inset 0 0 30px rgba(0,0,0,1);
}
.reel {
  width: 80px; height: 100px; background: linear-gradient(180deg, #222, #111);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 50px; border: 1px solid #444; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
}
.spinning { animation: spin 0.1s infinite linear; }
@keyframes spin { 100% { transform: translateY(10px); } }
.result-msg { text-align: center; font-size: 16px; font-weight: bold; min-height: 27px; margin-top: 15px; text-shadow: 0 0 10px currentColor; }
.win { color: #00ff88; }
.lose { color: #ff003c; }
.jackpot { color: #ffd700; animation: pulse 0.5s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); text-shadow: 0 0 20px #ffd700; } }

/* --- КОСМИЧЕСКАЯ РАКЕТА --- */
.space-window {
  background: var(--space); border-radius: 15px; height: 300px; position: relative;
  overflow: hidden; margin: 15px 0; border: 1px solid #333;
  box-shadow: inset 0 0 50px rgba(0,0,0,1);
}
.stars {
  position: absolute; top: 0; left: 0; width: 100%; height: 200%; 
  background-image: 
    radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
    radial-gradient(1px 1px at 50px 160px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
    radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0));
  background-repeat: repeat; background-size: 200px 200px;
  animation: starMove 1.5s linear infinite;
}
@keyframes starMove { from { background-position: 0 0; } to { background-position: 0 200px; } }

.multiplier-display {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  font-size: 60px; font-weight: 900; color: #fff; z-index: 1;
  text-shadow: 0 0 30px rgba(255,255,255,0.4); opacity: 0.9;
  font-variant-numeric: tabular-nums;
}

/* Контейнер для ракеты (управляет полетом) */
.rocket-container {
  position: absolute; 
  bottom: 40px; 
  left: 50%; 
  z-index: 2;
  transform-origin: center center;
  transform: translateX(-50%);
}

/* Внутренний контейнер ракеты (управляет наклоном) */
.rocket-inner {
  position: relative;
  display: inline-block;
}

/* Сама ракета */
.rocket-icon {
  font-size: 55px; 
  display: block; 
  filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
  position: relative;
  z-index: 2;
}

/* ПЛАМЯ (ОГОНЬ) - позиционируем ровно под соплом ракеты */
.flame {
  position: absolute;
  bottom: 12px; /* Чуть ниже центра ракеты */
  right: 28px;  /* Смещаем к хвосту */
  width: 35px;
  height: 20px;
  background: radial-gradient(ellipse at right, #ffffff 0%, #ffdd00 30%, #ff6a00 70%, transparent 100%);
  border-radius: 50% 0 0 50%;
  transform-origin: right center;
  opacity: 0;
  z-index: 1;
  /* Поворачиваем огонь вместе с ракетой */
  transform: rotate(-45deg); 
}

/* Когда ракета летит, огонь включается и пульсирует */
.rocket-inner.flying .flame {
  opacity: 1;
  animation: fire 0.08s infinite alternate;
}

@keyframes fire {
  from { transform: rotate(-45deg) scaleX(1); filter: brightness(1); }
  to { transform: rotate(-45deg) scaleX(1.5); filter: brightness(1.5); }
}

/* Анимация взрыва (взрывается вся картинка вместе с огнем) */
.explode {
  animation: explodeAnim 0.6s forwards !important;
}
@keyframes explodeAnim {
  0% { transform: scale(1); opacity: 1; }
  30% { transform: scale(1.5); filter: brightness(3); opacity: 1; }
  100% { transform: scale(4); opacity: 0; filter: blur(20px); }
}

/* Вкладки */
.tabs { display: flex; gap: 10px; margin-bottom: 15px; }
.tab-btn {
  flex: 1; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #888;
  border-radius: 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 12px;
  transition: 0.3s;
}
.tab-btn.active { background: rgba(255,215,0,0.15); border-color: var(--gold); color: var(--gold); }
.hidden { display: none !important; }
footer { text-align: center; color: #444; font-size: 11px; padding: 30px 15px; }
</style>
</head>
<body>
<header>
 <div class="logo">♛ ROYAL GOLD ♛</div>
 <div class="subtitle">PREMIUM VIRTUAL CASINO</div>
</header>
<main>

<section class="card" id="authCard">
 <h2>👤 Вход в клуб</h2>
 <div id="authForm">
  <label>Никнейм</label>
  <input id="nick" placeholder="Твой ник" minlength="3" maxlength="15">
  <label>Пароль</label>
  <input id="password" type="password" placeholder="Минимум 8 символов" minlength="8">
  <div class="row">
   <button onclick="account('login')">Войти</button>
   <button class="secondary" onclick="account('register')">Регистрация</button>
  </div>
 </div>
 <div id="profile" class="hidden">
  <h3 id="playerName" style="text-align:center; color:var(--gold); font-size:24px;"></h3>
  <div style="text-align:center; font-size:12px; color:#888; margin-top:10px;">ТВОЙ БАЛАНС</div>
  <div class="balance"><span id="balance">0</span> <span>VC</span></div>
  <button class="secondary" onclick="logout()">Выйти</button>
 </div>
</section>

<div class="tabs hidden" id="gameTabs">
  <button class="tab-btn active" onclick="switchGame('slots')" id="tabSlots">🎰 Слоты</button>
  <button class="tab-btn" onclick="switchGame('crash')" id="tabCrash">🚀 Ракета</button>
</div>

<!-- СЛОТЫ -->
<section class="card hidden" id="gameSlots">
 <h2>🎰 GOLDEN SLOTS</h2>
 <p style="font-size:12px; color:#aaa; margin-bottom:10px;">Чем выше ставка, тем ниже шанс выигрыша.</p>
 
 <div class="slot-window">
  <div class="reel" id="r1">💎</div>
  <div class="reel" id="r2">7️⃣</div>
  <div class="reel" id="r3">💎</div>
 </div>

 <div class="row">
  <div style="flex: 1;">
   <label>Ставка (мин. 50 VC)</label>
   <input id="stakeSlots" type="number" min="50" max="5000" value="50">
  </div>
 </div>
 
 <button id="playSlotsBtn" onclick="playSlots()" disabled>ВРАЩАТЬ БАРАБАНЫ</button>
 <div class="result-msg" id="msgSlots"></div>
</section>

<!-- РАКЕТА -->
<section class="card hidden" id="gameCrash">
 <h2>🚀 КОСМИЧЕСКИЙ КРАШ</h2>
 <p style="font-size:12px; color:#aaa; margin-bottom:10px;">Забери деньги до взрыва! (Макс. x8)</p>
 
 <div class="space-window">
  <div class="stars"></div>
  <div class="multiplier-display" id="crashMulti">x1.00</div>
  
  <!-- Контейнер полета -->
  <div class="rocket-container" id="rocketContainer">
    <!-- Контейнер наклона и огня -->
    <div class="rocket-inner" id="rocketInner">
      <div class="rocket-icon">🚀</div>
      <div class="flame"></div>
    </div>
  </div>
  
 </div>

 <div class="row">
  <div style="flex: 1;">
   <label>Ставка (мин. 50 VC)</label>
   <input id="stakeCrash" type="number" min="50" max="5000" value="50">
  </div>
 </div>
 
 <button id="playCrashBtn" class="danger" onclick="startCrash()" disabled>ЗАПУСТИТЬ РАКЕТУ</button>
 <button id="cashoutBtn" class="success hidden" onclick="cashout()">ЗАБРАТЬ ВЫИГРЫШ</button>
 <div class="result-msg" id="msgCrash"></div>
</section>

<section class="card">
 <h2>🏆 Зал Славы</h2>
 <ul class="list" id="leaderboard" style="list-style:none; padding:0; font-size:14px;"></ul>
</section>

<footer>ROYAL GOLD © 2024 · ТОЛЬКО ВИРТУАЛЬНАЯ ВАЛЮТА · 18+</footer>
</main>

<script>
let user = null;
const $ = id => document.getElementById(id);

const db = {
  getUser: (name) => JSON.parse(localStorage.getItem('rg_user_' + name)),
  saveUser: (u) => localStorage.setItem('rg_user_' + u.username, JSON.stringify(u)),
  getBoard: () => {
    let list = [];
    for (let i = 0; i < localStorage.length; i++) {
      let key = localStorage.key(i);
      if (key.startsWith('rg_user_')) list.push(JSON.parse(localStorage.getItem(key)));
    }
    return list.sort((a,b) => b.balance - a.balance).slice(0, 5);
  }
};

function showUser(u) {
  user = u;
  $("authForm").classList.toggle("hidden", !!u);
  $("profile").classList.toggle("hidden", !u);
  $("gameTabs").classList.toggle("hidden", !u);
  
  if (u) {
    $("playerName").textContent = u.username;
    updateUI();
    if($("gameSlots").classList.contains("hidden") && $("gameCrash").classList.contains("hidden")) {
        switchGame('slots');
    }
  } else {
    $("gameSlots").classList.add("hidden");
    $("gameCrash").classList.add("hidden");
    $("playSlotsBtn").disabled = true;
    $("playCrashBtn").disabled = true;
  }
  loadBoard();
}

function updateUI() {
  if (!user) return;
  $("balance").textContent = Number(user.balance).toLocaleString("ru-RU");
  
  if(!isSlotsBusy) $("playSlotsBtn").disabled = !user;
  if(!isCrashRunning) $("playCrashBtn").disabled = !user;
}

function account(mode) {
  const name = $("nick").value.trim();
  const pass = $("password").value;
  if (name.length < 3 || pass.length < 8) return alert("Ник > 3 символов, пароль > 8.");
  
  let existing = db.getUser(name);
  if (mode === 'register') {
    if (existing) return alert("Такой игрок уже есть!");
    existing = { username: name, password: pass, balance: 10000 };
    db.saveUser(existing);
    showUser(existing);
  } else {
    if (!existing || existing.password !== pass) return alert("Неверный ник или пароль!");
    showUser(existing);
  }
  $("password").value = "";
}

function logout() { showUser(null); }

function switchGame(game) {
  $("gameSlots").classList.toggle("hidden", game !== 'slots');
  $("gameCrash").classList.toggle("hidden", game !== 'crash');
  $("tabSlots").classList.toggle("active", game === 'slots');
  $("tabCrash").classList.toggle("active", game === 'crash');
}

// ==========================================
// СЛОТЫ
// ==========================================
let isSlotsBusy = false;

async function playSlots() {
  if (!user || isSlotsBusy) return;
  const stake = Number($("stakeSlots").value);
  
  if (isNaN(stake) || stake < 50) return alert("Минимальная ставка — 50 VC!");
  if (stake > user.balance) return alert("Недостаточно средств!");

  isSlotsBusy = true;
  $("playSlotsBtn").disabled = true;
  $("msgSlots").textContent = "Крутим...";
  $("msgSlots").className = "result-msg";
  
  const r1 = $("r1"), r2 = $("r2"), r3 = $("r3");
  r1.classList.add("spinning"); r2.classList.add("spinning"); r3.classList.add("spinning");

  user.balance -= stake;
  updateUI();

  let baseChance = 30;
  if (stake > 50) {
      let penalty = ((stake - 50) / 950) * 15; 
      baseChance = Math.max(15, 30 - penalty);
  }

  const rand = Math.random() * 100;
  const symbols = ["🍒", "🍋", "🔔", "💎", "7️⃣"];
  let result = [], winType = 0, payout = 0, msg = "";

  if (rand <= 2) {
    result = ["7️⃣", "7️⃣", "7️⃣"];
    winType = 3; payout = stake * 25; msg = "💥 ДЖЕКПОТ! x25 💥";
  } else if (rand <= 2 + (baseChance * 0.1)) { 
    result = ["💎", "💎", "💎"];
    winType = 2; payout = Math.floor(stake * 1.5); msg = "💎 Редкая удача! x1.5 💎";
  } else if (rand <= baseChance) { 
    result = ["🍒", "🍒", "🍋"]; 
    winType = 1; payout = stake * 2; msg = "🍒 Выигрыш! x2 🍒";
  } else {
    result = ["🍋", "🔔", "🍒"];
  }

  let count = 0;
  const timer = setInterval(() => {
    r1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    r2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    r3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    count++;
    if (count > 15) {
      clearInterval(timer);
      r1.classList.remove("spinning"); r2.classList.remove("spinning"); r3.classList.remove("spinning");
      r1.textContent = result[0]; r2.textContent = result[1]; r3.textContent = result[2];

      if (payout > 0) {
        user.balance += payout;
        $("msgSlots").textContent = msg;
        $("msgSlots").className = winType === 3 ? "result-msg jackpot" : "result-msg win";
        if (winType === 3 && navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else {
        $("msgSlots").textContent = "Повезет в следующий раз!";
        $("msgSlots").className = "result-msg lose";
      }
      
      db.saveUser(user);
      updateUI();
      loadBoard();
      isSlotsBusy = false;
      $("playSlotsBtn").disabled = false;
    }
  }, 80);
}

// ==========================================
// РАКЕТА (CRASH) - ИСПРАВЛЕНА
// ==========================================
let isCrashRunning = false;
let crashMulti = 1.0;
let crashAnimationFrame = null;
let crashTarget = 1.0; 

function startCrash() {
  if (!user || isCrashRunning) return;
  const stake = Number($("stakeCrash").value);
  
  if (isNaN(stake) || stake < 50) return alert("Минимальная ставка — 50 VC!");
  if (stake > user.balance) return alert("Недостаточно средств!");

  isCrashRunning = true;
  crashMulti = 1.0;
  
  user.balance -= stake;
  updateUI();

  $("msgCrash").textContent = "Ракета в полете...";
  $("msgCrash").className = "result-msg";
  $("playCrashBtn").classList.add("hidden");
  $("cashoutBtn").classList.remove("hidden");
  $("crashMulti").textContent = "x1.00";
  $("crashMulti").style.color = "#fff";
  
  const rocketContainer = $("rocketContainer");
  const rocketInner = $("rocketInner");
  
  // Сброс перед стартом
  rocketContainer.style.transition = "none";
  rocketContainer.style.transform = `translateX(-50%) translate(0px, 0px)`;
  rocketInner.classList.remove("explode");
  rocketInner.classList.add("flying"); // Включаем огонь
  rocketInner.style.opacity = "1";
  // Задаем изначальный наклон 45 градусов (в правый верхний угол)
  rocketInner.style.transform = `rotate(-45deg)`;
  
  // Расчет точки взрыва
  const isWinRun = Math.random() < 0.15; 
  if (isWinRun) {
    crashTarget = 8.00; 
  } else {
    const rand = Math.random();
    crashTarget = 1.0 + (Math.pow(rand, 2) * 7);
    if(crashTarget < 1.05) crashTarget = 1.05; 
  }

  const startTime = Date.now();
  
  function animateCrash() {
    if (!isCrashRunning) return;

    const elapsed = Date.now() - startTime;
    crashMulti = 1.0 + (elapsed / 1000) * 0.5; 

    if (crashMulti >= crashTarget) {
      // ВЗРЫВ
      isCrashRunning = false;
      crashMulti = crashTarget; 
      $("crashMulti").textContent = "x" + crashMulti.toFixed(2);
      
      rocketInner.classList.remove("flying"); // Выключаем огонь
      rocketInner.classList.add("explode");
      
      $("msgCrash").textContent = `💥 Ракета взорвалась на x${crashTarget.toFixed(2)}!`;
      $("msgCrash").className = "result-msg lose";
      $("crashMulti").style.color = "#ff003c";
      
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      setTimeout(resetCrash, 1500); 
      
    } else if (crashMulti >= 8.00) {
      crashMulti = 8.00;
      $("crashMulti").textContent = "x8.00";
      cashout(true);
    } else {
      $("crashMulti").textContent = "x" + crashMulti.toFixed(2);
      if (crashMulti > 4) $("crashMulti").style.color = "#ffd700";
      else if (crashMulti > 2) $("crashMulti").style.color = "#00ff88";

      // ТРАЕКТОРИЯ (Идем в правый верхний угол)
      let progress = (crashMulti - 1) / 7; 
      
      // Движение: вверх и вправо
      let moveX = Math.pow(progress, 1.5) * 120; // Вправо
      let moveY = -(Math.pow(progress, 0.8) * 200); // Вверх (сначала быстро, потом медленнее)
      
      // Наклон: от -45 (вверх-вправо) до -20 (более горизонтально к концу)
      let angle = -45 + (progress * 25);

      rocketContainer.style.transform = `translateX(-50%) translate(${moveX}px, ${moveY}px)`;
      rocketInner.style.transform = `rotate(${angle}deg)`;
      
      crashAnimationFrame = requestAnimationFrame(animateCrash);
    }
  }
  
  crashAnimationFrame = requestAnimationFrame(animateCrash);
}

function cashout(auto = false) {
  if (!isCrashRunning) return;
  isCrashRunning = false;
  if (crashAnimationFrame) cancelAnimationFrame(crashAnimationFrame);
  
  const stake = Number($("stakeCrash").value);
  const winAmount = Math.floor(stake * crashMulti);
  
  user.balance += winAmount;
  db.saveUser(user);
  updateUI();
  loadBoard();

  $("msgCrash").textContent = `✅ Забрал на x${crashMulti.toFixed(2)}. Выигрыш: +${winAmount} VC`;
  $("msgCrash").className = "result-msg win";
  $("crashMulti").style.color = "#00ff88";
  
  if (auto) {
     $("msgCrash").textContent = `🚀 Ракета долетела до x8.00! Автовыигрыш: +${winAmount} VC`;
  }
  
  setTimeout(resetCrash, 1500);
}

function resetCrash() {
  isCrashRunning = false;
  if (crashAnimationFrame) cancelAnimationFrame(crashAnimationFrame);
  
  const rocketContainer = $("rocketContainer");
  const rocketInner = $("rocketInner");
  
  rocketInner.classList.remove("flying"); // Выключаем огонь
  
  // Возврат на исходную
  rocketContainer.style.transition = "all 0.5s ease-out";
  rocketContainer.style.transform = `translateX(-50%) translate(0px, 0px)`;
  rocketInner.classList.remove("explode");
  rocketInner.style.opacity = "1";
  rocketInner.style.transform = `rotate(-45deg)`; // Стартовый наклон
  
  $("playCrashBtn").classList.remove("hidden");
  $("cashoutBtn").classList.add("hidden");
  $("playCrashBtn").disabled = false; 
  
  $("crashMulti").textContent = "x1.00";
  $("crashMulti").style.color = "#fff";
}

// --- РЕЙТИНГ ---
function loadBoard() {
  const board = db.getBoard();
  $("leaderboard").innerHTML = board.length ? 
    board.map((x, i) => `<li style="display:flex; justify-content:space-between; border-bottom:1px solid #333; padding:10px 0;">
      <span><b style="color:var(--gold)">#${i+1}</b> ${x.username}</span>
      <b>${Number(x.balance).toLocaleString("ru-RU")} VC</b>
    </li>`).join("") 
    : "<li>Пока нет игроков.</li>";
}
</script>
