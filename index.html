<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>ROYAL GOLD | Премиум Казино</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #ffd700;
  --gold-dark: #b8860b;
  --bg: #0a0a0c;
  --panel: rgba(25, 25, 30, 0.8);
  --neon: #ff003c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at top, #1a1a24 0%, var(--bg) 100%);
  color: #fff;
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: radial-gradient(var(--gold) 1px, transparent 1px);
  background-size: 50px 50px;
  opacity: 0.05;
  z-index: -1;
}
header {
  text-align: center;
  padding: 30px 15px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
}
.logo {
  font-size: 32px;
  font-weight: 900;
  color: var(--gold);
  text-transform: uppercase;
  letter-spacing: 2px;
  text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
}
.subtitle {
  color: #888;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-top: 5px;
}
main { max-width: 600px; margin: auto; padding: 15px; }
.card {
  background: var(--panel);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 215, 0, 0.2);
  border-radius: 20px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: "";
  position: absolute;
  top: 0; left: -100%; width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
  transform: skewX(-20deg);
  animation: shine 4s infinite;
}
@keyframes shine { 100% { left: 200%; } }

h2 { font-size: 18px; margin-bottom: 15px; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; }
label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; margin-top: 15px; }
input {
  width: 100%; padding: 14px; background: rgba(0,0,0,0.5);
  border: 1px solid #444; color: white; border-radius: 10px; font-size: 16px;
  font-family: 'Montserrat', sans-serif; transition: 0.3s;
}
input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 10px rgba(255,215,0,0.2); }
button {
  width: 100%; padding: 16px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, #ffd700, #b8860b);
  color: #000; font-weight: 900; font-size: 16px; text-transform: uppercase;
  cursor: pointer; transition: 0.2s; margin-top: 15px;
  box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
  font-family: 'Montserrat', sans-serif;
}
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
button.secondary {
  background: transparent; border: 1px solid var(--gold); color: var(--gold); box-shadow: none;
}
.row { display: flex; gap: 10px; }
.row button { margin-top: 0; }

.balance { font-size: 38px; font-weight: 900; color: #fff; text-align: center; margin: 10px 0; text-shadow: 0 0 20px rgba(255,255,255,0.3); }
.balance span { color: var(--gold); font-size: 20px; }

.slot-window {
  background: #000; border: 2px solid #333; border-radius: 15px;
  padding: 30px 10px; margin: 20px 0; display: flex; justify-content: center; gap: 10px;
  box-shadow: inset 0 0 30px rgba(0,0,0,1);
}
.reel {
  width: 80px; height: 100px; background: linear-gradient(180deg, #222, #111);
  border-radius: 10px; display: flex; align-items: center; justify-content: center;
  font-size: 50px; border: 1px solid #444; box-shadow: 0 5px 10px rgba(0,0,0,0.5);
}
.spinning { animation: spin 0.1s infinite linear; }
@keyframes spin { 100% { transform: translateY(10px); } }

.result-msg {
  text-align: center; font-size: 18px; font-weight: bold; min-height: 27px; margin-top: 15px;
  text-shadow: 0 0 10px currentColor;
}
.win { color: #00ff88; }
.lose { color: #ff003c; }
.jackpot { color: #ffd700; animation: pulse 0.5s infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.1); text-shadow: 0 0 20px #ffd700; } }

.hidden { display: none !important; }
footer { text-align: center; color: #444; font-size: 11px; padding: 30px 15px; }
</style>
</head>
<body>
<header>
 <div class="logo">♛ ROYAL GOLD ♛</div>
 <div class="subtitle">PREMIUM VIRTUAL CASINO</div>
</header>
<main>

<!-- Профиль / Авторизация -->
<section class="card" id="authCard">
 <h2>👤 Вход в клуб</h2>
 <div id="authForm">
  <label>Никнейм</label>
  <input id="nick" placeholder="Твой ник" minlength="3" maxlength="15">
  <label>Пароль</label>
  <input id="password" type="password" placeholder="Минимум 8 символов" minlength="8">
  <div class="row">
   <button onclick="account('login')">Войти</button>
   <button class="secondary" onclick="account('register')">Регистрация</button>
  </div>
 </div>
 <div id="profile" class="hidden">
  <h3 id="playerName" style="text-align:center; color:var(--gold); font-size:24px;"></h3>
  <div style="text-align:center; font-size:12px; color:#888; margin-top:10px;">ТВОЙ БАЛАНС</div>
  <div class="balance"><span id="balance">0</span> <span>VC</span></div>
  <button class="secondary" onclick="logout()">Выйти</button>
 </div>
</section>

<!-- Игровой автомат -->
<section class="card">
 <h2>🎰 GOLDEN SLOTS</h2>
 
 <div class="slot-window" id="slotWindow">
  <div class="reel" id="r1">💎</div>
  <div class="reel" id="r2">7️⃣</div>
  <div class="reel" id="r3">💎</div>
 </div>

 <div class="row">
  <div style="flex: 1;">
   <label>Ставка (VC)</label>
   <input id="stake" type="number" min="10" max="5000" value="100">
  </div>
 </div>
 
 <button id="playBtn" onclick="play()" disabled>ВРАЩАТЬ БАРАБАНЫ</button>
 <div class="result-msg" id="gameMsg">Войди в аккаунт, чтобы играть.</div>
</section>

<!-- Рейтинг -->
<section class="card">
 <h2>🏆 Зал Славы</h2>
 <ul class="list" id="leaderboard" style="list-style:none; padding:0; font-size:14px;">
  <li style="color:#888;">Загрузка данных...</li>
 </ul>
</section>

<footer>ROYAL GOLD © 2024 · ТОЛЬКО ВИРТУАЛЬНАЯ ВАЛЮТА · 18+</footer>
</main>

<script>
let user = null, busy = false;
const $ = id => document.getElementById(id);

const db = {
  getUser: (name) => JSON.parse(localStorage.getItem('rg_user_' + name)),
  saveUser: (u) => localStorage.setItem('rg_user_' + u.username, JSON.stringify(u)),
  getBoard: () => {
    let list = [];
    for (let i = 0; i < localStorage.length; i++) {
      let key = localStorage.key(i);
      if (key.startsWith('rg_user_')) list.push(JSON.parse(localStorage.getItem(key)));
    }
    return list.sort((a,b) => b.balance - a.balance).slice(0, 5);
  }
};

function showUser(u) {
  user = u;
  $("authForm").classList.toggle("hidden", !!u);
  $("profile").classList.toggle("hidden", !u);
  $("playBtn").disabled = !u || busy;
  if (u) {
    $("playerName").textContent = u.username;
    $("balance").textContent = Number(u.balance).toLocaleString("ru-RU");
    $("gameMsg").textContent = "Удачи, хайроллер!";
    $("gameMsg").className = "result-msg";
  } else {
    $("gameMsg").textContent = "Войди в аккаунт, чтобы играть.";
  }
  loadBoard();
}

function account(mode) {
  const name = $("nick").value.trim();
  const pass = $("password").value;
  if (name.length < 3 || pass.length < 8) return alert("Ник > 3 символов, пароль > 8.");
  
  let existing = db.getUser(name);
  if (mode === 'register') {
    if (existing) return alert("Такой игрок уже есть!");
    existing = { username: name, password: pass, balance: 10000 };
    db.saveUser(existing);
    showUser(existing);
  } else {
    if (!existing || existing.password !== pass) return alert("Неверный ник или пароль!");
    showUser(existing);
  }
  $("password").value = "";
}

function logout() { showUser(null); }

async function play() {
  if (!user || busy) return;
  const stake = Number($("stake").value);
  if (isNaN(stake) || stake < 10 || stake > user.balance) {
    return alert("Проверь ставку. Она должна быть от 10 до " + user.balance);
  }

  busy = true;
  $("playBtn").disabled = true;
  $("gameMsg").textContent = "Крутим...";
  $("gameMsg").className = "result-msg";
  
  const r1 = $("r1"), r2 = $("r2"), r3 = $("r3");
  r1.classList.add("spinning"); r2.classList.add("spinning"); r3.classList.add("spinning");

  user.balance -= stake;
  $("balance").textContent = Number(user.balance).toLocaleString("ru-RU");

  // Генерация результата (ОБЩИЙ ШАНС ВЫИГРЫША = 30%)
  const symbols = ["🍒", "🍋", "🔔", "💎", "7️⃣"];
  let result = [], winType = 0, payout = 0, msg = "";
  
  const rand = Math.random() * 100; // от 0 до 100

  if (rand <= 2) {
    // ДЖЕКПОТ 2%
    result = ["7️⃣", "7️⃣", "7️⃣"];
    winType = 3; payout = stake * 25; msg = "💥 ДЖЕКПОТ! x25 💥";
  } else if (rand <= 10) { // 2 + 8 = 10%
    // КРУПНЫЙ ВЫИГРЫШ 8%
    result = ["💎", "💎", "💎"];
    winType = 2; payout = stake * 4; msg = "💎 Крупный выигрыш! x4 💎";
  } else if (rand <= 30) { // 10 + 20 = 30% (ОСТАЛЬНЫЕ 70% - ПРОИГРЫШ)
    // МИНИ-ВЫИГРЫШ 20%
    result = ["🍒", "🍒", "🍋"]; // Два одинаковых
    winType = 1; payout = Math.floor(stake * 1.5); msg = "🍒 Неплохо! Возврат x1.5 🍒";
  } else {
    // ПРОИГРЫШ 70%
    result = ["🍋", "🔔", "🍒"]; // Все разные
  }

  let count = 0;
  const timer = setInterval(() => {
    r1.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    r2.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    r3.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    count++;
    if (count > 15) {
      clearInterval(timer);
      r1.classList.remove("spinning"); r2.classList.remove("spinning"); r3.classList.remove("spinning");
      
      r1.textContent = result[0]; r2.textContent = result[1]; r3.textContent = result[2];

      if (payout > 0) {
        user.balance += payout;
        $("balance").textContent = Number(user.balance).toLocaleString("ru-RU");
        $("gameMsg").textContent = msg;
        $("gameMsg").className = winType === 3 ? "result-msg jackpot" : "result-msg win";
        if (winType === 3 && navigator.vibrate) navigator.vibrate([200, 100, 200]);
      } else {
        $("gameMsg").textContent = "Повезет в следующий раз!";
        $("gameMsg").className = "result-msg lose";
      }
      
      db.saveUser(user);
      loadBoard();
      busy = false;
      $("playBtn").disabled = false;
    }
  }, 80);
}

function loadBoard() {
  const board = db.getBoard();
  $("leaderboard").innerHTML = board.length ? 
    board.map((x, i) => `<li style="display:flex; justify-content:space-between; border-bottom:1px solid #333; padding:10px 0;">
      <span><b style="color:var(--gold)">#${i+1}</b> ${x.username}</span>
      <b>${Number(x.balance).toLocaleString("ru-RU")} VC</b>
    </li>`).join("") 
    : "<li>Пока нет игроков.</li>";
}
</script>
</body>
</html>
